spring:
  application:
    name: inveskit-backend

  jpa:
    hibernate:
      ddl-auto: update        # 기존 데이터 유지하며 스키마 변경만 반영
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    com.inveskit.backend: DEBUG
    org.hibernate.SQL: DEBUG

yahoo:
  finance:
    base-url: https://query1.finance.yahoo.com
